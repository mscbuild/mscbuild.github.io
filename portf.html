<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portfolio Project</title>

    <style>
        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;

            background: #1D1F20;
            color: #fff;

            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            text-decoration: none;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;

            z-index: 1000;

            height: 80px;
            padding: 0 50px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: rgba(10, 10, 10, 0.92);
            backdrop-filter: blur(20px);

            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .nav-logo {
            color: #fff;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 35px;

            list-style: none;
        }

        .nav-links a {
            position: relative;

            color: #aaa;

            font-size: 11px;
            font-weight: 600;

            letter-spacing: 2px;
            text-transform: uppercase;

            transition: color 0.3s ease;
        }

        .nav-links a::after {
            content: "";

            position: absolute;
            left: 0;
            bottom: -7px;

            width: 0;
            height: 1px;

            background: #fff;

            transition: width 0.3s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #fff;
        }

        .nav-links a:hover::after,
        .nav-links a.active::after {
            width: 100%;
        }


        /* CTA */

        .nav-cta {
            padding: 12px 22px;

            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 2px;

            color: #fff;

            font-size: 10px;
            font-weight: 600;

            letter-spacing: 1.5px;
            text-transform: uppercase;

            transition: all 0.3s ease;
        }

        .nav-cta:hover {
            background: #fff;
            color: #111;
        }


        /* Mobile button */

        .nav-menu-btn {
            display: none;

            width: 44px;
            height: 44px;

            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;

            background: transparent;
            color: #fff;

            font-size: 24px;

            cursor: pointer;
        }


        /* =========================
           MAIN
        ========================= */

        main {
            flex: 1;

            width: 100%;
            padding-top: 120px;
            padding-bottom: 80px;
        }

        .container {
            width: min(1400px, 100%);
            margin: 0 auto;
            padding: 0 25px;
        }

        h1 {
            margin-bottom: 40px;

            color: #fff;

            text-align: center;

            font-size: clamp(32px, 5vw, 56px);
            font-weight: 500;

            letter-spacing: -1px;
        }


        /* =========================
           GALLERY
        ========================= */

        .gallery {
            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 20px;
        }

        .gallery-item {
            display: block;

            width: 100%;
            height: 130px;

            object-fit: cover;

            border-radius: 4px;

            cursor: pointer;

            transition:
                transform 0.4s ease,
                opacity 0.4s ease,
                filter 0.4s ease;
        }

        .gallery-item:hover {
            transform: scale(1.03);
            opacity: 0.85;
            filter: brightness(1.1);
        }


        /* =========================
           MODAL
        ========================= */

        .modal {
            position: fixed;

            inset: 0;

            z-index: 2000;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;

            background: rgba(0, 0, 0, 0.92);

            opacity: 0;
            visibility: hidden;

            transition:
                opacity 0.3s ease,
                visibility 0.3s ease;
        }

        .modal.show {
            opacity: 1;
            visibility: visible;
        }

        .modal-box {
            position: relative;

            width: min(1000px, 95vw);

            display: flex;
            flex-direction: column;
            align-items: center;

            animation: zoomIn 0.35s ease;
        }

        .modal-content {
            display: block;

            width: auto;
            max-width: 100%;
            max-height: 70vh;

            object-fit: contain;

            border-radius: 5px;

            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.6);
        }

        @keyframes zoomIn {
            from {
                transform: scale(0.85);
            }

            to {
                transform: scale(1);
            }
        }


        /* Close */

        .close {
            position: fixed;

            top: 25px;
            right: 35px;

            z-index: 10;

            width: 45px;
            height: 45px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #fff;

            font-size: 35px;
            font-weight: 300;

            cursor: pointer;

            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;

            transition:
                background 0.3s ease,
                transform 0.3s ease;
        }

        .close:hover {
            background: rgba(255,255,255,0.15);
            transform: rotate(90deg);
        }


        /* Caption */

        .caption {
            margin-top: 18px;

            color: #fff;

            font-size: 20px;
            font-weight: 500;

            text-align: center;
        }


        /* See more */

        .see-more {
            display: inline-block;

            margin-top: 18px;
            padding: 12px 28px;

            border: 1px solid rgba(255,255,255,0.4);

            color: #fff;

            font-size: 11px;
            font-weight: 600;

            letter-spacing: 2px;
            text-transform: uppercase;

            transition: all 0.3s ease;
        }

        .see-more:hover {
            background: #fff;
            color: #111;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            margin-top: auto;

            padding: 35px 20px;

            background: #111;

            border-top: 1px solid rgba(255,255,255,0.08);

            text-align: center;
        }

        .footer-content {
            width: min(1200px, 100%);
            margin: 0 auto;
        }

        .footer-logo {
            margin-bottom: 10px;

            color: #fff;

            font-size: 22px;
            font-weight: 700;
        }

        .footer-text {
            color: #777;

            font-size: 13px;
        }

        .footer-links {
            margin-top: 15px;

            display: flex;
            justify-content: center;
            gap: 25px;

            list-style: none;
        }

        .footer-links a {
            color: #888;

            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;

            transition: color 0.3s ease;
        }

        .footer-links a:hover {
            color: #fff;
        }


        /* =========================
           TABLET
        ========================= */

        @media (max-width: 1000px) {

            .navbar {
                padding: 0 25px;
            }

            .nav-links {
                gap: 20px;
            }

            .nav-cta {
                display: none;
            }

            .gallery {
                grid-template-columns: repeat(3, 1fr);
            }

            .gallery-item {
                height: 220px;
            }
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 768px) {

            .navbar {
                height: 70px;
                padding: 0 20px;
            }

            .nav-menu-btn {
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .nav-links {
                position: absolute;

                top: 70px;
                left: 0;
                right: 0;

                display: flex;
                flex-direction: column;
                align-items: stretch;

                gap: 0;

                padding: 10px 20px 20px;

                background: rgba(10, 10, 10, 0.98);

                border-bottom: 1px solid rgba(255,255,255,0.1);

                opacity: 0;
                visibility: hidden;

                transform: translateY(-10px);

                transition:
                    opacity 0.3s ease,
                    visibility 0.3s ease,
                    transform 0.3s ease;
            }

            .nav-links.active {
                opacity: 1;
                visibility: visible;
                transform: translateY(0);
            }

            .nav-links li {
                width: 100%;
            }

            .nav-links a {
                display: block;

                padding: 16px 5px;

                font-size: 12px;
            }

            .nav-links a::after {
                display: none;
            }

            main {
                padding-top: 100px;
                padding-bottom: 50px;
            }

            .container {
                padding: 0 15px;
            }

            h1 {
                margin-bottom: 25px;
            }

            .gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .gallery-item {
                height: 180px;
            }

            .modal {
                padding: 15px;
            }

            .modal-content {
                max-height: 65vh;
            }

            .close {
                top: 15px;
                right: 15px;

                width: 40px;
                height: 40px;

                font-size: 28px;
            }

            .caption {
                font-size: 17px;
            }

            .see-more {
                padding: 11px 22px;
            }
        }


        /* =========================
           SMALL MOBILE
        ========================= */

        @media (max-width: 480px) {

            .gallery {
                grid-template-columns: 1fr;
            }

            .gallery-item {
                height: auto;
                aspect-ratio: 16 / 10;
            }

            .footer-links {
                flex-direction: column;
                gap: 12px;
            }
        }

    </style>
</head>

    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        /* =========================
           MOBILE MENU
        ========================= */

        const menuBtn = document.getElementById("menuBtn");
        const navLinks = document.getElementById("navLinks");

        menuBtn.addEventListener("click", function () {

            navLinks.classList.toggle("active");

            const isOpen = navLinks.classList.contains("active");

            menuBtn.setAttribute("aria-expanded", isOpen);

            menuBtn.innerHTML = isOpen ? "&times;" : "☰";

        });


        /* Close mobile menu after click */

        document.querySelectorAll(".nav-links a").forEach(function(link) {

            link.addEventListener("click", function() {

                navLinks.classList.remove("active");

                menuBtn.setAttribute("aria-expanded", "false");

                menuBtn.innerHTML = "☰";

            });

        });


        /* =========================
           MODAL
        ========================= */

        const modal = document.getElementById("portfolioModal");
        const modalImage = document.getElementById("modalImage");
        const modalCaption = document.getElementById("modalCaption");
        const seeMore = document.getElementById("seeMore");
        const closeModalButton = document.getElementById("closeModal");

        const galleryItems = document.querySelectorAll(".gallery-item");


        /* Open modal */

        galleryItems.forEach(function(item) {

            item.addEventListener("click", function() {

                const imageSrc = item.getAttribute("src");
                const imageAlt = item.getAttribute("alt");
                const title = item.getAttribute("data-title");
                const link = item.getAttribute("data-link");

                modalImage.src = imageSrc;
                modalImage.alt = imageAlt;

                modalCaption.textContent = title;

                seeMore.href = link;

                modal.classList.add("show");

                modal.setAttribute("aria-hidden", "false");

                document.body.style.overflow = "hidden";

            });

        });


        /* Close modal */

        function closeModal() {

            modal.classList.remove("show");

            modal.setAttribute("aria-hidden", "true");

            document.body.style.overflow = "";

            setTimeout(function() {

                modalImage.src = "";

                modalCaption.textContent = "";

                seeMore.href = "#";

            }, 300);

        }


        closeModalButton.addEventListener("click", closeModal);


        /* Close when clicking outside image */

        modal.addEventListener("click", function(event) {

            if (event.target === modal) {

                closeModal();

            }

        });


        /* Close with ESC */

        document.addEventListener("keydown", function(event) {

            if (event.key === "Escape" && modal.classList.contains("show")) {

                closeModal();

            }

        });


        /* =========================
           NAVBAR ACTIVE LINK
        ========================= */

        const sections = document.querySelectorAll("main, footer");

        window.addEventListener("scroll", function() {

            const scrollPosition = window.scrollY + 150;

            document.querySelectorAll(".nav-links a").forEach(function(link) {

                link.classList.remove("active");

            });

            if (scrollPosition >= 0) {

                const workLink = document.querySelector('.nav-links a[href="#work"]');

                if (workLink) {
                    workLink.classList.add("active");
                }

            }

        });

    </script>
